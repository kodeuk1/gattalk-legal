<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17151F"><title>고객지원 | OnStage</title><meta name="description" content="OnStage 고객지원 문의 접수"><style>
    :root{color-scheme:light;--ink:#17151F;--paper:#F6F3EE;--coral:#FF765B;--mint:#36C9A1;--violet:#E9E2FF;--line:#ded8cd}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;line-height:1.7}

    .lead{max-width:650px;margin:0;color:#5d5865;font-size:clamp(17px,2.2vw,21px)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:90px}.card{min-height:220px;padding:26px;border:1px solid var(--line);border-radius:22px;background:#fff}
    .card:nth-child(1){border-top:5px solid var(--coral)}.card:nth-child(2){border-top:5px solid var(--mint)}.card:nth-child(3){border-top:5px solid #9687d8}.card strong{display:block;margin-bottom:12px;font-size:19px}.card p{margin:0;color:#66616b}
    .doc{display:grid;grid-template-columns:220px minmax(0,1fr);gap:64px;padding:68px 0 96px}.toc{position:sticky;top:24px;align-self:start}.toc a{display:block;padding:7px 0;color:#6a6570;text-decoration:none;font-size:14px}.content{max-width:720px}.content p,.content li{color:#514d57}.content section{padding-bottom:22px}.meta{color:#77717c;font-size:14px}.notice{padding:18px 20px;border-radius:16px;background:#fff;border:1px solid var(--line)}
    form{display:grid;gap:14px;margin-top:28px;padding:24px;border:1px solid var(--line);border-radius:22px;background:#fff}label{display:grid;gap:7px;font-size:14px;font-weight:750}input,select,textarea{width:100%;border:1px solid #cfc7ba;border-radius:12px;background:#fff;padding:13px 14px;font:inherit;color:var(--ink)}textarea{min-height:150px;resize:vertical}button{border:0;border-radius:12px;background:var(--ink);color:#fff;padding:14px 18px;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.result{min-height:28px;margin:0;font-size:14px}.result.ok{color:#08775d}.result.bad{color:#b02a2a}
    footer{padding:28px 0 44px;border-top:1px solid var(--line);color:#77717c;font-size:13px}.footerrow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footerlinks{display:flex;gap:16px}
    @media(max-width:720px){.navlinks{gap:12px;font-size:12px}.hero{padding-top:62px}.cards{grid-template-columns:1fr}.doc{grid-template-columns:1fr;gap:22px}.toc{position:static;display:none}}
  </style></head><body>

  <main class="shell doc"><aside class="toc"><span class="eyebrow">SUPPORT</span></aside><article class="content"><h1 style="font-size:clamp(38px,6vw,62px)">무엇을 도와드릴까요?</h1><p class="lead">계정, 초대, 리포트, 촬영과 개인정보 문의를 남겨 주세요. 확인 후 입력한 이메일로 답변드립니다.</p><h3>계정 삭제</h3><p>로그인 후 프로필 → 개인정보 및 계정 → 계정 삭제에서 직접 처리할 수 있습니다. 로그인할 수 없다면 아래 문의 유형에서 ‘계정’을 선택해 주세요.</p><form id="support-form"><label>답변받을 이메일<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="name@example.com"></label><label>문의 유형<select name="category"><option value="support" selected>일반 문의</option><option value="privacy">개인정보</option><option value="account">계정</option><option value="technical">기술 문제</option></select></label><label>문의 내용<textarea name="message" minlength="10" maxlength="2000" required placeholder="확인할 수 있도록 상황을 자세히 적어 주세요."></textarea></label><button type="submit">문의 접수</button><p class="result" role="status" aria-live="polite"></p></form><script>
  const form=document.querySelector('#support-form'); const result=form.querySelector('.result');
  form.addEventListener('submit',async(event)=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;result.className='result';result.textContent='접수 중입니다…';const data=new FormData(form);try{const response=await fetch('https://omanvlbbathgbtritejr.supabase.co/rest/v1/rpc/submit_support_request',{method:'POST',headers:{'content-type':'application/json','apikey':'sb_publishable_MWzIfIcc_rSINwxNp32Wiw_uwAqESNF','authorization':'Bearer sb_publishable_MWzIfIcc_rSINwxNp32Wiw_uwAqESNF'},body:JSON.stringify({p_contact_email:data.get('email'),p_category:data.get('category'),p_message:data.get('message')})});if(!response.ok)throw new Error();form.reset();result.className='result ok';result.textContent='접수되었습니다. 입력한 이메일로 답변드리겠습니다.';}catch{result.className='result bad';result.textContent='지금은 접수할 수 없습니다. 잠시 후 다시 시도해 주세요.';}finally{button.disabled=false;}});
